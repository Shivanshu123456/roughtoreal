      <div class="container grid grid-two--cols">
        <div class="contact-content">
          <form action="#">
            <div class="grid grid-two-cols mb-3">
              <div>

                <input
                  type="text"
                  name="username"

            <div class="mb-3">

                type="text"
                name="subject"

            </div>

            <div class="mb-3">
              <label for="message">message</label>
              <textarea
                name="message"
                id="message"
                cols="30"
                rows="10"
                placeholder="we are always here to help you."
              ></textarea>
            </div>

            <div class="mt-3">

    <!-- START: dynamic products injection (added by ChatGPT) -->
    <div id="dynamic-products" style="padding: 20px">
      <h2>Products (dynamic)</h2>
      <div
        id="products"
        style="display: flex; gap: 16px; flex-wrap: wrap"
      ></div>
    </div>

    <!-- Video Modal -->
    <div
      id="videoModal"
      style="
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
        z-index: 9999;
      "
    >
      <div
        style="
          position: relative;
          width: 90%;
          max-width: 900px;
          background: #111;
          padding: 10px;
          border-radius: 8px;
        "
      >
        <button
          id="closeVideo"
          style="position: absolute; right: 8px; top: 6px; font-size: 18px"
        >
          ✕
        </button>
        <video
          id="productVideo"
          controls
          style="width: 100%; height: auto; background: #000"
        ></video>
      </div>
    </div>

    <script>
      (async function () {
        try {
          const res = await fetch("products.json");
          const products = await res.json();
          const container = document.getElementById("products");
          products.forEach((p) => {
            const card = document.createElement("div");
            card.style.border = "1px solid #ddd";
            card.style.borderRadius = "8px";
            card.style.padding = "12px";
            card.style.width = "260px";
            card.style.boxSizing = "border-box";
            card.style.background = "#fff";
            card.innerHTML = `
        <h3 style="margin:6px 0;">${p.title}</h3>
        <p style="margin:6px 0;color:#666;">${p.description}</p>
        <p style="margin:6px 0;font-weight:600;">${p.price}</p>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="playVideo" data-video="${p.video}" style="flex:1;padding:8px;border-radius:6px;border:0;cursor:pointer;">Play Video</button>
          <button style="flex:1;padding:8px;border-radius:6px;border:0;cursor:pointer;background:#eee;">Add</button>
        </div>
      `;
            container.appendChild(card);
          });

          // modal logic
          const modal = document.getElementById("videoModal");
          const vid = document.getElementById("productVideo");
          const closeBtn = document.getElementById("closeVideo");
          document.querySelectorAll(".playVideo").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const v = btn.getAttribute("data-video");
              vid.src = v;
              modal.style.display = "flex";
              vid.play().catch(() => {});
            });
          });
          closeBtn.addEventListener("click", () => {
            vid.pause();
            vid.src = "";
            modal.style.display = "none";
          });
          // close on backdrop click
          modal.addEventListener("click", (e) => {
            if (e.target === modal) {
              vid.pause();
              vid.src = "";
              modal.style.display = "none";
            }
          });
        } catch (err) {
          console.error("Failed to load products.json", err);
        }
      })();
    </script>
    <!-- END: dynamic products injection -->
